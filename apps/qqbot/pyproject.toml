[project]
name = "underline-mc-qqbot"
version = "0.2.0"
description = "毯毯：QQ 群的工具任务和知识库服务，聊天交给 MaiBot"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.116.0,<1.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qqbot = ["static/*.html"]

[project.scripts]
qq-essence-export = "qqbot.essence_exporter:main"
qqbot-web = "qqbot.web:main"
qqbot-config = "qqbot.settings:main"
qqbot-start = "qqbot.start:main"
