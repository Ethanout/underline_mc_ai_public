<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QQ Bot 导出器</title>
<style>body{font:16px system-ui;max-width:720px;margin:40px auto;padding:0 18px}label{display:block;margin:14px 0 4px}input{width:100%;box-sizing:border-box;padding:8px}button{margin-top:18px;padding:9px 14px}pre{white-space:pre-wrap;background:#f4f4f4;padding:12px}</style>
<h1>QQ Bot 群精华导出</h1>
<p>Token 仅从服务器环境变量 <code>ONEBOT_ACCESS_TOKEN</code> 读取。</p>
<form id="form">
<label>OneBot endpoint</label><input name="endpoint" value="http://127.0.0.1:3000">
<label>授权群号</label><input name="group_id" required>
<label>输出目录</label><input name="output" value="runtime/private/qq_group_digest">
<label>Action</label><input name="action" value="get_essence_msg_list">
<label><input type="checkbox" name="diagnose"> 仅诊断，不写入消息或媒体</label>
<label><input type="checkbox" name="refresh"> 重新读取已存在的消息</label>
<button>开始任务</button>
</form><pre id="status">就绪</pre>
<h2>技术研究库</h2>
<p>将 minecraft、vanilla-dev、programming 标签的条目导出到配置的 Wiki 根目录。AI 整理条目保留未验证标记。</p>
<button id="export-research" type="button">导出技术研究到 Wiki</button>
<button id="list-research" type="button">查看研究条目</button>
<pre id="research-status">未加载</pre>
<script>
const form=document.querySelector('#form'), status=document.querySelector('#status');
fetch('/api/health').then(r=>r.json()).then(h=>{if(h.onebot_endpoint)form.endpoint.value=h.onebot_endpoint}).catch(()=>{});
form.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));d.diagnose=!!form.diagnose.checked;d.refresh=!!form.refresh.checked;let r=await fetch('/api/jobs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)});let j=await r.json();status.textContent=JSON.stringify(j,null,2);if(j.id){let timer=setInterval(async()=>{let x=await (await fetch('/api/jobs/'+j.id)).json();status.textContent=JSON.stringify(x,null,2);if(['succeeded','failed'].includes(x.status))clearInterval(timer)},1000)}};
const researchStatus=document.querySelector('#research-status');
document.querySelector('#export-research').onclick=async()=>{try{const r=await fetch('/api/research/export',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});researchStatus.textContent=JSON.stringify(await r.json(),null,2)}catch(e){researchStatus.textContent='导出失败：'+e.message}};
document.querySelector('#list-research').onclick=async()=>{try{researchStatus.textContent=JSON.stringify(await (await fetch('/api/research')).json(),null,2)}catch(e){researchStatus.textContent='读取失败：'+e.message}};
</script>
