[project]
name = "underline-mc-ai"
version = "0.1.0"
description = "Development environment for Underline Tricks Collector"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.116.0,<1.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
agent = ["langgraph", "langgraph-checkpoint-sqlite"]
dev = ["ruff>=0.8.0", "httpx>=0.27.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".archive", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
